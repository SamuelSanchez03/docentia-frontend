<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Docentia · Auto-reporte del profesor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { ink: "#444444", "ink-muted": "#888888", hairline: "#d9d9d9", canvas: "#ffffff", "surface-1": "#f3f5f7",
            primary: "#dd4c4f", "theme-forest": "#2b6451", "theme-blue": "#456aa3", "theme-teal": "#8ec2c2", ambar: "#b7791f" },
  fontFamily: { body: ["Nunito", "sans-serif"], display: ["Nunito", "sans-serif"] }
} } };
</script>
<style>
  body { font-family: Nunito, sans-serif; line-height: 1.7; }
  h1, h2, .font-display { font-weight: 400; }
  .panel-scroll { scrollbar-width: thin; scrollbar-color: #d9d9d9 transparent; }
  .panel-scroll::-webkit-scrollbar { width: 6px; }
  .panel-scroll::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 9999px; }
  @media print { .no-print { display: none !important; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="bg-canvas text-ink font-body antialiased min-h-screen flex flex-col">
  <header class="no-print border-b border-hairline">
    <div class="max-w-[1180px] mx-auto px-6 py-4 grid grid-cols-1 md:grid-cols-[auto_1fr_1fr_auto] items-end gap-6">
      <span class="font-display text-3xl text-primary">Docentia</span>
      <label class="text-sm text-ink-muted">Institución
        <select id="selEscuela" class="block mt-1 w-full rounded-lg border-hairline text-sm text-ink"></select></label>
      <label class="text-sm text-ink-muted">Profesor
        <select id="selProfesor" class="block mt-1 w-full rounded-lg border-hairline text-sm text-ink"></select></label>
      <div class="text-sm text-ink-muted">Periodo
        <div class="flex items-center gap-2 mt-1">
          <select id="selDesde" aria-label="Desde el año" class="rounded-lg border-hairline text-sm text-ink"></select>
          <span>a</span>
          <select id="selHasta" aria-label="Hasta el año" class="rounded-lg border-hairline text-sm text-ink"></select>
        </div></div>
    </div>
  </header>
  <main class="flex-1 w-full max-w-[1180px] mx-auto px-6 py-10">
    <div id="reporte"></div>
  </main>
  <footer class="border-t border-hairline">
    <p class="max-w-[1180px] mx-auto px-6 py-4 text-sm text-ink-muted">
      Fuente: evaluaciones de Rate My Professors (muestra) · <span id="fuenteDatos">—</span> · Sin variables demográficas · Este reporte no es un dictamen laboral.
    </p>
  </footer>
  <script src="js/datos.js?v=2026-10-31"></script>
  <script src="js/reporte.js?v=2026-10-31"></script>
  <script src="js/filtro_lenguaje.js?v=2026-10-31"></script>
  <script src="js/catalogo.js?v=2026-10-31"></script>
  <script src="js/aspectos_logica.js?v=2026-10-31"></script>
  <script src="js/aspectos_vista.js?v=2026-10-31"></script>
  <script src="js/profesor.js?v=2026-10-31"></script>
</body>
</html>
